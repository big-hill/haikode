blank_issues_enabled: true
contact_links:
  - name: Security issue
    url: https://github.com/big-hill/haikode/security/advisories/new
    about: >
      Report privately, not as a public issue. haikode holds OAuth tokens and
      runs shell commands, so a flaw in permissions, redaction or the repo
      trust boundary should not be described in public before it is fixed.
